name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run instead of publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  publish:
    if: github.repository == 'soumyarupsarkar/spargio'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Check crates.io token
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN}" ]; then
            echo "Missing CARGO_REGISTRY_TOKEN secret."
            exit 1
          fi

      - name: Publish crates in dependency order
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          dry_run=false
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            dry_run=true
          fi

          publish_manifest() {
            local manifest="$1"
            echo "Publishing ${manifest}"
            if [ "${dry_run}" = "true" ]; then
              cargo publish --manifest-path "${manifest}" --dry-run \
                --config 'patch.crates-io.spargio.path="."' \
                --config 'patch.crates-io.spargio-macros.path="spargio-macros"' \
                --config 'patch.crates-io.spargio-protocols.path="crates/spargio-protocols"'
            else
              cargo publish --manifest-path "${manifest}"
              # Let crates.io index propagate before dependent crates.
              sleep 30
            fi
          }

          # Dependency order:
          # spargio-macros -> spargio -> spargio-protocols -> (signal/process/quic) -> (tls/ws)
          publish_manifest "spargio-macros/Cargo.toml"
          publish_manifest "Cargo.toml"
          publish_manifest "crates/spargio-protocols/Cargo.toml"
          publish_manifest "crates/spargio-signal/Cargo.toml"
          publish_manifest "crates/spargio-process/Cargo.toml"
          publish_manifest "crates/spargio-quic/Cargo.toml"
          publish_manifest "crates/spargio-tls/Cargo.toml"
          publish_manifest "crates/spargio-ws/Cargo.toml"
