[package]
name = "spargio-quic"
version = "0.3.0"
edition = "2024"
license = "MIT"
description = "QUIC companion crate for spargio (quinn bridge)"
repository = "https://github.com/soumyarupsarkar/spargio"

[dependencies]
quinn = "0.11"
spargio = { path = "../.." }
tokio = { version = "1", features = ["rt", "time"] }

[dev-dependencies]
futures = "0.3"
