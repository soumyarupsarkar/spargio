[package]
name = "spargio-tls"
version = "0.5.9"
edition = "2024"
license = "MIT"
description = "TLS companion crate for spargio (rustls/futures-rustls bridge)"
repository = "https://github.com/soumyarupsarkar/spargio"

[dependencies]
futures-rustls = { version = "0.26", default-features = false, features = ["ring", "logging", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "logging", "tls12"] }
spargio = { version = "0.5.9", path = "../..", features = ["uring-native"] }
spargio-protocols = { version = "0.5.9", path = "../spargio-protocols", features = ["uring-native"] }

[dev-dependencies]
futures = "0.3"
rcgen = "0.13"
